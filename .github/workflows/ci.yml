name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test (JVM + Android host)
        run: ./gradlew :markdown:jvmTest :markdown:testAndroidHostTest --stacktrace

  ios:
    # This library publishes iOS artifacts to Maven Central, and until now nothing ever built them.
    # A macOS runner is the only place that can, so it is the only place the iOS half of a release
    # can be checked before it ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Runs the shared tests on a simulator rather than only compiling them. Compiling proves the
      # code is valid Kotlin/Native; running proves the parser behaves the same on Native as it
      # does on the JVM, which is the actual promise a multiplatform library makes.
      - name: Test (iOS simulator)
        run: ./gradlew :markdown:iosSimulatorArm64Test --stacktrace
